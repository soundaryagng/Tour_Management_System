<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .sidebar { background: linear-gradient(180deg, #2d3748, #1a202c); min-height: 100vh; }
        .sidebar-link { display:block; color:rgba(255,255,255,0.75); padding:10px 16px; border-radius:8px; margin-bottom:4px; text-decoration:none; transition:.2s; }
        .sidebar-link:hover, .sidebar-link.active { background:rgba(255,255,255,0.12); color:#fff; }
    </style>
</head>
<body style="background:#f4f6fb;">
<div class="container-fluid g-0">
    <div class="row g-0" style="min-height:100vh">
        <div class="col-md-3 col-lg-2 sidebar d-flex flex-column">
            <div class="p-4 text-center border-bottom border-white border-opacity-25">
                <i class="fas fa-shield-alt fa-3x text-warning mb-2"></i>
                <h6 class="text-white fw-bold mb-0">Admin Panel</h6>
            </div>
            <nav class="p-3 flex-grow-1">
                <a href="/admin/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a href="/admin/trips" class="sidebar-link"><i class="fas fa-suitcase me-2"></i>Manage Trips</a>
                <a href="/admin/trips/add" class="sidebar-link"><i class="fas fa-plus-circle me-2"></i>Add Trip</a>
                <a href="/admin/bookings" class="sidebar-link active"><i class="fas fa-ticket-alt me-2"></i>All Bookings</a>
                <a href="/trips" class="sidebar-link"><i class="fas fa-globe me-2"></i>View Site</a>
            </nav>
            <div class="p-3 border-top border-white border-opacity-25">
                <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
            </div>
        </div>
        <div class="col-md-9 col-lg-10 p-4">
            <h4 class="fw-bold mb-4">All Bookings</h4>
            <div th:if="${param.success}" class="alert alert-success" th:text="${param.success}"></div>
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Customer</th>
                                    <th>Trip</th>
                                    <th>Date</th>
                                    <th>Adults</th>
                                    <th>Children</th>
                                    <th>Amount</th>
                                    <th>Payment</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="booking : ${bookings}">
                                    <td class="font-monospace small" th:text="${booking.bookingId}">BKG</td>
                                    <td>
                                        <div th:text="${booking.user.name}">User</div>
                                        <small class="text-muted" th:text="${booking.user.email}">email</small>
                                    </td>
                                    <td th:text="${booking.trip.packageName}">Trip</td>
                                    <td th:text="${booking.travelDate}">Date</td>
                                    <td th:text="${booking.numberOfAdults}">1</td>
                                    <td th:text="${booking.numberOfChildren}">0</td>
                                    <td>$<span th:text="${booking.totalAmount}">0</span></td>
                                    <td>
                                        <small th:text="${booking.paymentMethod}">-</small>
                                        <div th:if="${booking.upiId != null and !booking.upiId.isEmpty()}" class="text-success small font-monospace" th:text="${booking.upiId}"></div>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${booking.bookingStatus == 'CONFIRMED'} ? 'bg-success' : (${booking.bookingStatus == 'CANCELLED'} ? 'bg-danger' : 'bg-warning text-dark')" th:text="${booking.bookingStatus}">STATUS</span>
                                    </td>
                                    <td>
                                        <form th:if="${booking.bookingStatus != 'CANCELLED'}" th:action="@{/admin/bookings/cancel/{id}(id=${booking.id})}" method="post" class="d-inline" onsubmit="return confirm('Cancel this booking?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill">Cancel</button>
                                        </form>
                                        <span th:if="${booking.bookingStatus == 'CANCELLED'}" class="text-muted small">—</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(bookings)}">
                                    <td colspan="10" class="text-center text-muted py-4">No bookings found</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
