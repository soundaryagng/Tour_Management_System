<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Travel Ease</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container-fluid g-0">
    <div class="row g-0" style="min-height:100vh">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar d-flex flex-column">
            <div class="p-4 text-center border-bottom border-white border-opacity-25">
                <i class="fas fa-user-circle fa-3x text-white mb-2"></i>
                <h6 class="text-white fw-bold mb-0" th:text="${session.user.name}">User</h6>
                <small class="text-white-50">Customer</small>
            </div>
            <nav class="p-3 flex-grow-1">
                <a href="/dashboard" class="sidebar-link active"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a href="/trips" class="sidebar-link"><i class="fas fa-search me-2"></i>Browse Trips</a>
                <a href="/my-bookings" class="sidebar-link"><i class="fas fa-calendar-alt me-2"></i>My Bookings</a>
                <a href="/h2-console" class="sidebar-link" target="_blank"><i class="fas fa-database me-2"></i>H2 Console</a>
            </nav>
            <div class="p-3">
                <a href="/logout" class="sidebar-link text-danger-emphasis"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 p-4 bg-light">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">My Dashboard</h4>
                <a href="/trips" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus me-1"></i>Book New Trip
                </a>
            </div>

            <!-- Stats Cards -->
            <div class="row g-3 mb-4">
                <div class="col-sm-4">
                    <div class="card border-0 shadow-sm text-center p-3">
                        <i class="fas fa-suitcase-rolling fa-2x text-primary mb-2"></i>
                        <h3 class="fw-bold" th:text="${totalBookings}">0</h3>
                        <p class="text-muted small mb-0">Total Bookings</p>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="card border-0 shadow-sm text-center p-3">
                        <i class="fas fa-map-marker-alt fa-2x text-success mb-2"></i>
                        <h3 class="fw-bold" th:text="${totalTrips}">0</h3>
                        <p class="text-muted small mb-0">Confirmed Trips</p>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="card border-0 shadow-sm text-center p-3">
                        <i class="fas fa-trophy fa-2x text-warning mb-2"></i>
                        <h3 class="fw-bold" th:text="${loyaltyPoints}">0</h3>
                        <p class="text-muted small mb-0">Loyalty Points</p>
                    </div>
                </div>
            </div>

            <!-- Recent Bookings -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">📋 Recent Bookings</h5>
                    <a href="/my-bookings" class="btn btn-outline-primary btn-sm">View All</a>
                </div>
                <div class="card-body p-0">
                    <div th:if="${recentBookings.isEmpty()}" class="p-4 text-center text-muted">
                        <i class="fas fa-calendar-times fa-2x mb-2"></i>
                        <p>No bookings yet. <a href="/trips">Browse trips</a> to get started!</p>
                    </div>
                    <div class="table-responsive" th:if="${!recentBookings.isEmpty()}">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr><th>Booking ID</th><th>Trip</th><th>Travel Date</th><th>Amount</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="b : ${recentBookings}">
                                    <td class="small fw-semibold" th:text="${b.bookingId}">BKG</td>
                                    <td th:text="${b.trip.packageName}">Trip</td>
                                    <td th:text="${b.travelDate}">Date</td>
                                    <td>$<span th:text="${b.totalAmount}">0</span></td>
                                    <td>
                                        <span class="badge rounded-pill"
                                              th:classappend="${b.bookingStatus == 'CONFIRMED'} ? 'bg-success' : (${b.bookingStatus == 'CANCELLED'} ? 'bg-danger' : 'bg-warning text-dark')"
                                              th:text="${b.bookingStatus}">Status</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/chatbot-widget.js" defer></script>
</body>
</html>
