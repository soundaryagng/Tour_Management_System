# ─── Server ────────────────────────────────────────────────
server.port=4040
server.servlet.context-path=/

# ─── H2 FILE-BASED Persistent Database ─────────────────────
# Stores data in ./data/tripdb.mv.db — survives restarts
spring.datasource.url=jdbc:h2:file:./data/tripdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── H2 Web Console ────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ─── JPA / Hibernate ───────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'update' keeps existing rows across restarts (was 'create-drop' which wiped everything!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── Thymeleaf ─────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ─── Logging ───────────────────────────────────────────────
logging.level.com.travel=DEBUG
