<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Trip - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .sidebar { background: linear-gradient(180deg, #2d3748, #1a202c); min-height: 100vh; }
        .sidebar-link { display:block; color:rgba(255,255,255,0.75); padding:10px 16px; border-radius:8px; margin-bottom:4px; text-decoration:none; transition:.2s; }
        .sidebar-link:hover { background:rgba(255,255,255,0.12); color:#fff; }
    </style>
</head>
<body style="background:#f4f6fb;">
<div class="container-fluid g-0">
    <div class="row g-0" style="min-height:100vh">
        <div class="col-md-3 col-lg-2 sidebar d-flex flex-column">
            <div class="p-4 text-center border-bottom border-white border-opacity-25">
                <i class="fas fa-shield-alt fa-3x text-warning mb-2"></i>
                <h6 class="text-white fw-bold mb-0">Admin Panel</h6>
            </div>
            <nav class="p-3 flex-grow-1">
                <a href="/admin/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a href="/admin/trips" class="sidebar-link"><i class="fas fa-suitcase me-2"></i>Manage Trips</a>
                <a href="/admin/trips/add" class="sidebar-link"><i class="fas fa-plus-circle me-2"></i>Add Trip</a>
                <a href="/admin/bookings" class="sidebar-link"><i class="fas fa-ticket-alt me-2"></i>All Bookings</a>
                <a href="/trips" class="sidebar-link"><i class="fas fa-globe me-2"></i>View Site</a>
            </nav>
            <div class="p-3 border-top border-white border-opacity-25">
                <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
            </div>
        </div>
        <div class="col-md-9 col-lg-10 p-4">
            <div class="d-flex align-items-center mb-4 gap-3">
                <a href="/admin/trips" class="btn btn-outline-secondary btn-sm rounded-pill">← Back</a>
                <h4 class="fw-bold mb-0">Edit Trip: <span th:text="${trip.packageName}">Name</span></h4>
            </div>
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <form th:action="@{/admin/trips/edit/{id}(id=${trip.id})}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Package Name *</label>
                                <input type="text" name="packageName" class="form-control" th:value="${trip.packageName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Destination *</label>
                                <input type="text" name="destination" class="form-control" th:value="${trip.destination}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Country *</label>
                                <input type="text" name="country" class="form-control" th:value="${trip.country}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Image URL</label>
                                <input type="url" name="imageUrl" class="form-control" th:value="${trip.imageUrl}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Duration (Days) *</label>
                                <input type="number" name="durationDays" class="form-control" th:value="${trip.durationDays}" min="1" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Price ($) *</label>
                                <input type="number" name="price" class="form-control" th:value="${trip.price}" min="1" step="0.01" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Total Seats *</label>
                                <input type="number" name="totalSeats" class="form-control" th:value="${trip.totalSeats}" min="1" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Rating</label>
                                <input type="number" name="rating" class="form-control" th:value="${trip.rating}" min="0" max="5" step="0.1">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Trip Type *</label>
                                <select name="international" class="form-select" required>
                                    <option value="true" th:selected="${trip.international}">International</option>
                                    <option value="false" th:selected="${!trip.international}">National (India)</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Description *</label>
                                <textarea name="description" class="form-control" rows="3" th:text="${trip.description}" required></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Inclusions</label>
                                <input type="text" name="inclusions" class="form-control" th:value="${trip.inclusions}">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Exclusions</label>
                                <input type="text" name="exclusions" class="form-control" th:value="${trip.exclusions}">
                            </div>
                        </div>
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-warning rounded-pill px-5">
                                <i class="fas fa-save me-2"></i>Save Changes
                            </button>
                            <a href="/admin/trips" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
