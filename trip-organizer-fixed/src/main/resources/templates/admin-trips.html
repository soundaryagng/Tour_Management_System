<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Trips - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .sidebar { background: linear-gradient(180deg, #2d3748, #1a202c); min-height: 100vh; }
        .sidebar-link { display:block; color:rgba(255,255,255,0.75); padding:10px 16px; border-radius:8px; margin-bottom:4px; text-decoration:none; transition:.2s; }
        .sidebar-link:hover, .sidebar-link.active { background:rgba(255,255,255,0.12); color:#fff; }
    </style>
</head>
<body style="background:#f4f6fb;">
<div class="container-fluid g-0">
    <div class="row g-0" style="min-height:100vh">
        <div class="col-md-3 col-lg-2 sidebar d-flex flex-column">
            <div class="p-4 text-center border-bottom border-white border-opacity-25">
                <i class="fas fa-shield-alt fa-3x text-warning mb-2"></i>
                <h6 class="text-white fw-bold mb-0">Admin Panel</h6>
                <small class="text-white-50" th:text="${session.user.name}">Admin</small>
            </div>
            <nav class="p-3 flex-grow-1">
                <a href="/admin/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a href="/admin/trips" class="sidebar-link active"><i class="fas fa-suitcase me-2"></i>Manage Trips</a>
                <a href="/admin/trips/add" class="sidebar-link"><i class="fas fa-plus-circle me-2"></i>Add Trip</a>
                <a href="/admin/bookings" class="sidebar-link"><i class="fas fa-ticket-alt me-2"></i>All Bookings</a>
                <a href="/trips" class="sidebar-link"><i class="fas fa-globe me-2"></i>View Site</a>
            </nav>
            <div class="p-3 border-top border-white border-opacity-25">
                <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
            </div>
        </div>
        <div class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Manage Trips</h4>
                <a href="/admin/trips/add" class="btn btn-primary rounded-pill px-4">
                    <i class="fas fa-plus me-2"></i>Add New Trip
                </a>
            </div>
            <div th:if="${param.success}" class="alert alert-success" th:text="${param.success}"></div>
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Image</th>
                                    <th>Package</th>
                                    <th>Destination</th>
                                    <th>Type</th>
                                    <th>Price</th>
                                    <th>Seats</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="trip : ${trips}">
                                    <td>
                                        <img th:src="${trip.imageUrl}" style="width:60px;height:45px;object-fit:cover;border-radius:8px;"
                                             onerror="this.src='https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=200&q=60'">
                                    </td>
                                    <td class="fw-semibold" th:text="${trip.packageName}">Name</td>
                                    <td th:text="${trip.destination + ', ' + trip.country}">Location</td>
                                    <td>
                                        <span class="badge" th:classappend="${trip.international} ? 'bg-primary' : 'bg-success'" th:text="${trip.international} ? 'International' : 'National'"></span>
                                    </td>
                                    <td>$<span th:text="${trip.price}">0</span></td>
                                    <td th:text="${trip.availableSeats + '/' + trip.totalSeats}">20/20</td>
                                    <td>
                                        <a th:href="@{/admin/trips/edit/{id}(id=${trip.id})}" class="btn btn-sm btn-outline-warning rounded-pill me-1">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/admin/trips/delete/{id}(id=${trip.id})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Delete this trip?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
