<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Travel Ease</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="auth-card card shadow-lg border-0 p-4">
                <div class="text-center mb-4">
                    <a href="/" class="text-decoration-none">
                        <i class="fas fa-plane-departure fa-3x text-primary"></i>
                    </a>
                    <h3 class="mt-3 fw-bold">Welcome Back!</h3>
                    <p class="text-muted">Login to continue your journey</p>
                </div>

                <div th:if="${param.registered}" class="alert alert-success py-2">
                    <i class="fas fa-check-circle me-2"></i>Account created! Please login.
                </div>
                <div th:if="${error}" class="alert alert-danger py-2">
                    <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
                </div>

                <form action="/login" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="mb-0 text-muted">Don't have an account? <a href="/register" class="fw-semibold">Sign Up</a></p>
                </div>

                <div class="mt-4 p-3 bg-light rounded">
                    <p class="text-muted small mb-1 fw-bold">🔑 Demo Credentials:</p>
                    <p class="text-muted small mb-0">Customer: <code>test@email.com</code> / <code>password</code></p>
                    <p class="text-muted small mb-0">Admin: <code>admin@travelease.com</code> / <code>admin123</code></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/chatbot-widget.js" defer></script>
</body>
</html>
